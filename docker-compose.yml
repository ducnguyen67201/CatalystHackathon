services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:55436:5432'
    environment:
      POSTGRES_USER: june
      POSTGRES_PASSWORD: june_local
      POSTGRES_DB: june
    volumes:
      - june_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U june -d june']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  june_data:
